# 📝 Workflow Name
name: Deploy (JAR + systemd)

# 🚀 Trigger deployment only when code is pushed to the main branch
on:
  push:
    branches: ["main"]

env:
  DEPLOY_PATH: "/opt/myapp/"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Step 2: Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ✅ Step 3: Build the Spring Boot project using Maven
      - name: Build JAR with Maven
        run: mvn -B -DskipTests package

      # ✅ Step 4: Verify the JAR
      - name: List files after build
        run: ls -al app-backend/target

      # ✅ Step 5: Set JAR name
      - name: Get JAR name
        id: get-jar
        run: |
          echo "jar_name=app-backend/target/app-backend-0.0.0-SNAPSHOT.jar" >> $GITHUB_OUTPUT
          echo "jar_basename=app-backend-0.0.0-SNAPSHOT.jar" >> $GITHUB_OUTPUT

      # ✅ Step 6: Upload JAR as artifact
      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: app-backend/target/app-backend-0.0.0-SNAPSHOT.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # ✅ Step 1: Download the JAR artifact
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: ./

      # ✅ Step 2: Copy JAR to remote server
      - name: Copy JAR to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "./app-backend-0.0.0-SNAPSHOT.jar"
          #tell scp-action to upload the JAR into the user’s home directory (where it has write access)
          target: "~/"

      # ✅ Step 3: SSH into server and start the app
      - name: SSH into VPS and Start Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -o errexit
            set -o pipefail

            echo "📦 Moving JAR into place..."
            mkdir -p /opt/myapp/
            mv -f ~/app-backend-0.0.0-SNAPSHOT.jar /opt/myapp/app.jar
            
            echo "🧾 Checking for uploaded JAR"
            ls -lh "/opt/myapp/app.jar"

            echo "🔁 Stopping old process..."
            pkill -f "/opt/myapp/app.jar" || echo "No app process found"

            echo "🚀 Starting app in background..."
            nohup java -jar /opt/myapp/app.jar > /opt/myapp/app_log.log 2>&1 < /dev/null &

            echo "✅ App started, logs at /opt/myapp/app_log.log"
            tail -n 20 /opt/myapp/app_log.log || true

            disown
            exit 0
