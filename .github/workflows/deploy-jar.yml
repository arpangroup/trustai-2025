# 📝 Workflow Name
name: Deploy (JAR + systemd)

# 🚀 Trigger deployment only when code is pushed to the main branch
on:
  push:
    branches: ["main"]

env:
  DEPLOY_PATH: "/opt/myapp/"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Use GitHub's hosted Ubuntu runner

    steps:
      # ✅ Step 1: Checkout the code from your GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Step 2: Set up Java 21 using Temurin distribution
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ✅ Step 3: Build the Spring Boot project using Maven
      # -B = batch mode (non-interactive)
      # -DskipTests = skip unit tests to speed up the build
      - name: Build with Maven
        run: mvn -B -DskipTests package

      #      # Setup Run Unit Tests
      #      - name: Unit Tests
      #        run: mvn -B test --file pom.xml   # po.xml from root directory

      # Verify the JAR actually exists:
      - name: Verify build artifacts
        run: ls -l app-backend/target

      # ✅ Step 4: Get the built JAR filename - Set JAR name (hardcoded to known filename)
      - name: Get JAR name
        id: get-jar
        run: |
          echo "jar_name=app-backend/target/app-backend-0.0.0-SNAPSHOT.jar" >> $GITHUB_OUTPUT
          echo "jar_basename=app-backend-0.0.0-SNAPSHOT.jar" >> $GITHUB_OUTPUT

      # ✅ Step 5: Copy the built JAR file to the remote server
      - name: Copy JAR to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}                  # IP or hostname of the remote server
          username: ${{ secrets.REMOTE_USER }}              # SSH username (e.g., ubuntu)
          key: ${{ secrets.SSH_PRIVATE_KEY }}               # Private key for authentication
          port: 22                                          # Usually 22 unless custom
          source: "./${{ steps.get-jar.outputs.jar_name }}" # Path to the generated JAR
          target: ${{ env.DEPLOY_PATH }}                    # Where to copy the JAR on the server

      # ✅ Step 6: SSH into the server and deploy the JAR via systemd
      # - Move the new JAR into place
      # - Set ownership to the spring user
      # - Restart the systemd service
      # - Show its status
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            # 🔍 Find the latest JAR file in the copied directory
            JAR_BASENAME="${{ steps.get-jar.outputs.jar_basename }}"
            FULL_PATH="/opt/myapp/app-backend/target/$JAR_BASENAME"
            
            echo "🧾 Checking for uploaded JAR at $FULL_PATH"
            ls -lh "$FULL_PATH"
            
            echo "📦 Moving $FULL_PATH → /opt/myapp/app.jar"
            mv "$FULL_PATH" /opt/myapp/app.jar

            # 👤 Set ownership (ensure the 'spring' user has permission)
            chown cicd_deploy:cicd_deploy /opt/myapp/app.jar
            chmod +x /opt/myapp/app.jar
                        
            # 🔁 Restart the app using systemd service manager
            # sudo systemctl restart myapp

            # 📋 Show the status of the app (no pager, full output)
            # sudo systemctl status myapp --no-pager -l || sudo journalctl -u myapp --no-pager -n 50
            
            # 🔁 Stop old process (if running)
            pkill -f "/opt/myapp/app.jar" || echo "No app process found"
            
            # 🚀 Start the app in the background using nohup
            echo "🔧 Starting app with nohup..."
            nohup java -jar /opt/myapp/app.jar > /opt/myapp/app.log 2>&1 &
            
            echo "App started, logs at /opt/myapp/app.log"

