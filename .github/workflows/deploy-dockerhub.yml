# .github/workflows/deploy-dockerhub.yml

name: 🐳 CI/CD via Docker Hub

on:
#  push:
#    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag to deploy (default: commit SHA)"
        required: false
        default: ""
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy from Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout the code from the GitHub repo
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      # Log in to Docker Hub using secrets
      - name: 🔐 Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build and tag the Docker image
      - name: 🏗️ Build Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/trustai-app
          docker build -t $IMAGE_NAME:latest .

      # Push image to Docker Hub
      - name: 📦 Push image to Docker Hub
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/trustai-app
          docker push $IMAGE_NAME:latest

      # SSH into remote server and deploy the latest image
      - name: 🚀 Deploy on Remote Server (Pull from Docker Hub)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🐳 Pull and Run on Server
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} <<EOF
            docker pull ${{ secrets.DOCKER_USERNAME }}/trustai-app:latest
            docker stop trustai-app || true && docker rm trustai-app || true
            docker run -d --name trustai-app -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/trustai-app:latest
          EOF
